<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TS-Typer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main class="game">
      <header class="title">
        <h1>TS<span>·</span>TYPER</h1>
        <p class="tagline">Type the words before they drift off the edge.</p>
      </header>

      <section id="gameInputs" class="hud">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value"><span id="scoreValue">0</span></span>
        </div>

        <div class="typer-wrap">
          <input
            type="text"
            id="typer"
            placeholder="type here…"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            autofocus
          />
        </div>

        <div class="stat stat-missed">
          <span class="stat-label">Missed</span>
          <span class="stat-value"><span id="missedValue">0</span><span class="stat-max">/10</span></span>
        </div>
      </section>

      <div class="screen">
        <canvas></canvas>
      </div>

      <footer class="hint">
        Type <kbd>start</kbd> to play · words turn
        <span class="warn">yellow</span> then <span class="danger">red</span> as they near the edge
      </footer>
    </main>

    <script type="module" src="src/main.ts"></script>
  </body>
</html>
